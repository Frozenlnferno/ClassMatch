services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    environment:
      # Docker containers must use the host gateway to reach `supabase start`.
      SUPABASE_URL: http://host.docker.internal:54321
      # Public Storage links are consumed by the host browser, not the container.
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      # Token claims use Supabase's browser-facing URL, even though the
      # container reaches Supabase through host.docker.internal.
      SUPABASE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      DB_SSLMODE: disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # backend-java:
  #   profiles:
  #     - migration
  #   build:
  #     context: ./backend-java
  #     target: dev
  #   env_file: ./backend-java/.env
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./backend-java:/app

  worker:
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      SUPABASE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      DB_SSLMODE: disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "run_worker.py"]
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_FRONTEND_ORIGIN: ${VITE_FRONTEND_ORIGIN}
      DEV_API_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  frontend_node_modules:

name: Test, Build, and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/classmatch-frontend

jobs:
  test:
    name: Run frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_FRONTEND_ORIGIN: ${{ vars.VITE_FRONTEND_ORIGIN }}

  docker:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Hub and Vite settings
        run: |
          test -n "${{ vars.DOCKERHUB_USERNAME }}" || {
            echo "Set repository variable DOCKERHUB_USERNAME before publishing images."
            exit 1
          }
          test -n "${{ vars.VITE_SUPABASE_URL }}" || {
            echo "Set repository variable VITE_SUPABASE_URL before building the frontend image."
            exit 1
          }
          test -n "${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}" || {
            echo "Set repository variable VITE_SUPABASE_PUBLISHABLE_KEY before building the frontend image."
            exit 1
          }

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_FRONTEND_ORIGIN=${{ vars.VITE_FRONTEND_ORIGIN }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

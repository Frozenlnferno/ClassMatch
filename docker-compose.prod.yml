services:
  backend:
    image: ${DOCKERHUB_USERNAME}/classmatch-backend:${RELEASE_VERSION:?Set RELEASE_VERSION to the commit SHA to deploy}
    container_name: classmatch-backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: ${DOCKERHUB_USERNAME}/classmatch-backend:${RELEASE_VERSION:?Set RELEASE_VERSION to the commit SHA to deploy}
    container_name: classmatch-worker
    restart: unless-stopped
    env_file: ./backend/.env.production
    command: ["python", "run_worker.py"]

  frontend:
    image: ${DOCKERHUB_USERNAME}/classmatch-frontend:${RELEASE_VERSION:?Set RELEASE_VERSION to the commit SHA to deploy}
    container_name: classmatch-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
